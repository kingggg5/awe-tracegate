name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[api,dev]"
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type-check
        run: python -m mypy src
      - name: Test
        run: python -m pytest

  package:
    name: Build package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  plugin-package:
    name: npm package and Git install smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Check the generated Claude Code adapter
        run: python scripts/sync_claude_plugin.py --root . --check
      - name: Validate Claude Code plugin and marketplace
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.226 plugin validate integrations/claude-code
          npx --yes @anthropic-ai/claude-code@2.1.226 plugin validate .claude-plugin/marketplace.json
      - name: Test the zero-dependency installer
        run: npm run test:installer
      - name: Pack the root npm distribution
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/npm-pack"
          npm pack --pack-destination "${RUNNER_TEMP}/npm-pack"
          mapfile -t archives < <(find "${RUNNER_TEMP}/npm-pack" -maxdepth 1 -type f -name '*.tgz')
          test "${#archives[@]}" -eq 1
          echo "archive=${archives[0]}" >> "${GITHUB_OUTPUT}"
      - name: Reproduce plugin and npm bundles with deterministic metadata
        shell: bash
        env:
          NPM_ARCHIVE: ${{ steps.pack.outputs.archive }}
        run: |
          set -euo pipefail
          release_root="${RUNNER_TEMP}/release-smoke"
          second_pack="${RUNNER_TEMP}/npm-pack-second"
          mkdir -p "${release_root}" "${second_pack}"

          npm pack --pack-destination "${second_pack}"
          cmp "${NPM_ARCHIVE}" "${second_pack}/$(basename "${NPM_ARCHIVE}")"
          cp "${NPM_ARCHIVE}" "${release_root}/"

          python scripts/build_release_bundles.py plugin \
            --root . --out "${release_root}/awe-tracegate-plugin.zip"
          python scripts/build_release_bundles.py plugin \
            --root . --out "${RUNNER_TEMP}/awe-tracegate-plugin-second.zip"
          cmp \
            "${release_root}/awe-tracegate-plugin.zip" \
            "${RUNNER_TEMP}/awe-tracegate-plugin-second.zip"

          source_date_epoch="$(git show -s --format=%ct HEAD)"
          python scripts/build_release_bundles.py metadata \
            --root . \
            --dist "${release_root}" \
            --sbom "${release_root}/awe-tracegate-release.spdx.json" \
            --checksums "${release_root}/SHA256SUMS" \
            --source-date-epoch "${source_date_epoch}"
          (cd "${release_root}" && sha256sum --check SHA256SUMS)
      - name: Install the npm archive and exercise its CLI
        shell: bash
        env:
          NPM_ARCHIVE: ${{ steps.pack.outputs.archive }}
        run: |
          set -euo pipefail
          install_root="${RUNNER_TEMP}/npm-archive-install"
          target_root="${RUNNER_TEMP}/npm-archive-target"
          mkdir -p "${install_root}" "${target_root}"
          npm install --ignore-scripts --no-audit --no-fund \
            --prefix "${install_root}" "${NPM_ARCHIVE}"
          cli="${install_root}/node_modules/.bin/awe-tracegate"
          expected_version="$(node --input-type=module -e \
            "import packageJson from './package.json' with { type: 'json' }; console.log(packageJson.version)")"
          test "$("${cli}" --version)" = "awe-tracegate ${expected_version}"
          "${cli}" list
          "${cli}" install --target "${target_root}"
          "${cli}" check --target "${target_root}"
      - name: Install the exact checkout through Git and exercise its CLI
        shell: bash
        run: |
          set -euo pipefail
          install_root="${RUNNER_TEMP}/npm-git-install"
          target_root="${RUNNER_TEMP}/npm-git-target"
          mkdir -p "${install_root}" "${target_root}"
          npm install --ignore-scripts --no-audit --no-fund \
            --prefix "${install_root}" \
            "git+file://${GITHUB_WORKSPACE}#${GITHUB_SHA}"
          cli="${install_root}/node_modules/.bin/awe-tracegate"
          expected_version="$(node --input-type=module -e \
            "import packageJson from './package.json' with { type: 'json' }; console.log(packageJson.version)")"
          test "$("${cli}" --version)" = "awe-tracegate ${expected_version}"
          "${cli}" list
          "${cli}" install --target "${target_root}"
          "${cli}" check --target "${target_root}"

  workspace:
    name: Agent runtime workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/workspace/package-lock.json
      - name: Install Workspace dependencies
        run: npm ci --prefix apps/workspace
      - name: Type-check and validate browser JavaScript
        run: npm run workspace:check
      - name: Test contracts, storage, and loopback API
        run: npm run workspace:test

  postgres-harness:
    name: PostgreSQL/Alembic migration evidence
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install AWE and harness dependencies
        run: |
          python -m pip install -e .
          python -m pip install -r examples/postgres-alembic-discovery/harness/requirements.txt
      - name: Run forward, preservation, rollback, and test lanes
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/postgres-alembic-experiment.json"
          python examples/postgres-alembic-discovery/harness/run.py \
            --dsn "postgresql://postgres:postgres@127.0.0.1:5432/postgres" \
            --repository "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --commit-sha "${GITHUB_SHA}" \
            --out "${output}"
          python -c 'import json, pathlib; payload=json.loads(pathlib.Path("'"${output}"'").read_text()); assert payload["schema_version"] == "awe.postgres-alembic-experiment.v1"; assert {check["outcome"] for check in payload["trials"][0]["checks"]} == {"success"}'

  typescript-sdk:
    name: TypeScript SDK contract parity
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API contract exporter
        run: python -m pip install -e ".[api]"
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install SDK dependencies
        run: npm ci --prefix sdk/typescript
      - name: Regenerate OpenAPI contract and SDK types
        run: |
          python scripts/export_openapi.py --out sdk/typescript/openapi.json
          npm run generate --prefix sdk/typescript
      - name: Reject generated contract drift
        run: git diff --exit-code -- sdk/typescript/openapi.json sdk/typescript/src/schema.d.ts
      - name: Type-check, build, and audit SDK
        run: |
          npm run check --prefix sdk/typescript
          npm run build --prefix sdk/typescript
          npm audit --prefix sdk/typescript --audit-level=high

  action-smoke:
    name: GitHub Action smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run AWE TraceGate
        id: tracegate
        uses: ./
        with:
          traces: examples/repo_analysis/traces.jsonl
          baseline-evaluation: examples/evaluation/baseline.json
          candidate-evaluation: examples/evaluation/candidate.json
          evaluation-policy: examples/evaluation/policy.json
      - name: Assert PASS decision
        shell: bash
        env:
          AWE_DECISION: ${{ steps.tracegate.outputs.decision }}
          AWE_RECEIPT_HASH: ${{ steps.tracegate.outputs.receipt-hash }}
          AWE_RECEIPT_PATH: ${{ steps.tracegate.outputs.receipt-path }}
        run: |
          set -euo pipefail
          test "${AWE_DECISION}" = "PASS"
          [[ "${AWE_RECEIPT_HASH}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "${AWE_RECEIPT_PATH}" = "awe-gate-receipt.json"
          test -f "${AWE_RECEIPT_PATH}"
      - name: Upload atomic gate receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: awe-gate-receipt
          path: awe-gate-receipt.json
          if-no-files-found: error

  container-smoke:
    name: Build and smoke container
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build image
        run: docker build --tag awe-tracegate:ci .
      - name: Verify non-root runtime and health
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name awe-tracegate-ci \
            --publish 127.0.0.1:8080:8080 awe-tracegate:ci
          trap 'docker logs awe-tracegate-ci; docker rm --force awe-tracegate-ci' EXIT

          test "$(docker exec awe-tracegate-ci id -u)" != "0"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz \
              | grep --quiet '"mode":"offline_keyless"'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
