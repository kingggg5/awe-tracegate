<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">AWE Workspace discovery handoff map</title>
  <desc id="desc">Animated editorial map of AWE Workspace: capture a goal, shape a Discovery brief, approve narrow permissions, and export a typed handoff for an external runner. Workspace does not execute tools or make TraceGate decisions.</desc>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#16202a" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto">
      <path d="M0 0 12 5 0 10z" fill="#16202a"/>
    </marker>
  </defs>

  <!-- Calm editorial surface: no gradient, readable when animation is disabled. -->
  <rect width="1440" height="860" fill="#f3f1ed"/>
  <g font-family="Atkinson Hyperlegible Next, Segoe UI, Noto Sans, Arial, sans-serif" fill="#16202a">
    <text x="72" y="72" font-size="18" font-weight="750" letter-spacing=".12em" fill="#5e6872">AWE WORKSPACE / DISCOVERY HANDOFF</text>
    <text x="72" y="135" font-size="54" font-weight="780" letter-spacing="-.035em">Make progress visible.</text>
    <text x="72" y="178" font-size="23" fill="#4b5661">A local-first map from a goal to a human-approved handoff.</text>
    <g transform="translate(1078 54)">
      <rect width="290" height="48" rx="24" fill="#16202a"/>
      <text x="24" y="31" font-size="17" font-weight="750" fill="#f3f1ed">LOCAL · HUMAN-GATED</text>
    </g>

    <g transform="translate(72 228)" filter="url(#lift)">
      <rect width="1296" height="512" rx="24" fill="#fffdf9" stroke="#c4cbd1" stroke-width="2"/>
      <path d="M0 82h1296" stroke="#d6dadd" stroke-width="2"/>
      <text x="40" y="50" font-size="21" font-weight="750">Workspace / current run</text>
      <text x="1030" y="50" font-size="18" font-weight="700" fill="#1a7f37">NO RUNNER ACTIVE</text>

      <!-- slim navigation rail -->
      <g transform="translate(40 118)">
        <rect width="176" height="346" rx="14" fill="#e7edf3"/>
        <text x="24" y="42" font-size="18" font-weight="750">AWE</text>
        <text x="24" y="68" font-size="15" fill="#5e6872">Workspace</text>
        <rect x="16" y="102" width="144" height="44" rx="10" fill="#fffdf9" stroke="#c4cbd1"/>
        <circle cx="38" cy="124" r="7" fill="#0969da"/><text x="56" y="130" font-size="17" font-weight="700">Home</text>
        <text x="24" y="188" font-size="16" fill="#4b5661">Discovery</text>
        <text x="24" y="228" font-size="16" fill="#4b5661">Evidence</text>
        <text x="24" y="268" font-size="16" fill="#4b5661">Handoffs</text>
        <path d="M24 302h128" stroke="#c4cbd1" stroke-width="2"/>
        <text x="24" y="332" font-size="14" fill="#5e6872">Loopback only</text>
      </g>

      <!-- kinetic route -->
      <g transform="translate(264 118)">
        <text x="0" y="24" font-size="16" font-weight="750" letter-spacing=".1em" fill="#5e6872">THE ROUTE</text>
        <path d="M38 175H970" stroke="#16202a" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 16">
          <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="3.8s" repeatCount="indefinite"/>
        </path>
        <circle cx="38" cy="175" r="18" fill="#0969da">
          <animate attributeName="r" values="18;24;18" dur="3.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="348" cy="175" r="18" fill="#8250df">
          <animate attributeName="r" values="18;24;18" dur="3.8s" begin=".9s" repeatCount="indefinite"/>
        </circle>
        <circle cx="658" cy="175" r="18" fill="#bf8700">
          <animate attributeName="r" values="18;24;18" dur="3.8s" begin="1.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="970" cy="175" r="18" fill="#1a7f37">
          <animate attributeName="r" values="18;24;18" dur="3.8s" begin="2.7s" repeatCount="indefinite"/>
        </circle>
        <g font-size="21" font-weight="760">
          <text x="0" y="235">01</text><text x="310" y="235">02</text><text x="620" y="235">03</text><text x="932" y="235">04</text>
        </g>
        <g font-size="24" font-weight="760">
          <text x="0" y="272">Capture goal</text><text x="310" y="272">Shape brief</text><text x="620" y="272">Approve scope</text><text x="932" y="272">Export handoff</text>
        </g>
        <g font-size="17" fill="#4b5661">
          <text x="0" y="308">What should change?</text><text x="310" y="308">What proves it?</text><text x="620" y="308">What may be shared?</text><text x="932" y="308">Who runs next?</text>
        </g>

        <rect x="0" y="350" width="1010" height="82" rx="14" fill="#eef5ff" stroke="#9eb6d2" stroke-width="2"/>
        <text x="28" y="383" font-size="18" font-weight="750" fill="#0969da">BOUNDARY</text>
        <text x="28" y="413" font-size="18" fill="#2f3b46">Workspace coordinates the work. The external host executes it; TraceGate verifies held evidence later.</text>
      </g>
    </g>
    <text x="72" y="805" font-size="19" fill="#4b5661">No shell. No browser. No credentials. Just an explicit, reviewable handoff.</text>
  </g>
</svg>
