name: Feature request
description: Propose an evidence-backed product improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or safety problem cannot be solved today?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and success measure
      description: How can the problem and proposed outcome be measured?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful solution
      description: Describe a narrow solution and important non-goals.
    validations:
      required: true
