<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">AWE TraceGate discovery loop walkthrough</title>
  <desc id="desc">A recorded offline synthetic walkthrough: generate a review bundle, independently replay it, then inspect its READY PASS status. Animated highlights move through the three steps when the renderer supports SVG animation.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#010409" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0 8 3 0 6z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="24" fill="url(#background)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="56" y="58" font-size="22" font-weight="700" fill="#f0f6fc">Discovery Loop: prove the next reusable change</text>
    <text x="56" y="88" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#8b949e">Recorded from the included synthetic demo. The verifier runs offline; an external harness owns agent execution.</text>

    <g transform="translate(56 126)" filter="url(#shadow)">
      <rect width="1088" height="418" rx="16" fill="#010409" stroke="#30363d"/>
      <path d="M0 54h1088" stroke="#30363d"/>
      <circle cx="27" cy="27" r="6" fill="#ff7b72"/>
      <circle cx="49" cy="27" r="6" fill="#d29922"/>
      <circle cx="71" cy="27" r="6" fill="#3fb950"/>
      <text x="101" y="33" font-size="14" fill="#8b949e">awe — offline evidence decision</text>

      <g transform="translate(34 94)">
        <rect width="1008" height="76" rx="10" fill="#0d1117" stroke="#21262d"/>
        <circle cx="25" cy="38" r="9" fill="#1f6feb">
          <animate attributeName="opacity" values="1;.35;1" dur="3.6s" begin="0s" repeatCount="indefinite"/>
        </circle>
        <text x="20" y="43" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="white">1</text>
        <text x="55" y="33" font-size="15" fill="#c9d1d9">$ awe demo --out awe-demo</text>
        <text x="55" y="57" font-size="13" fill="#8b949e">Generate a complete, visibly synthetic Gate v2 review bundle. No model or network calls.</text>
        <rect x="856" y="20" width="118" height="34" rx="17" fill="#143d2a" stroke="#238636"/>
        <text x="883" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#3fb950">PASS</text>
      </g>

      <path d="M538 180v38" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)">
        <animate attributeName="stroke" values="#8b949e;#58a6ff;#8b949e" dur="3.6s" begin=".8s" repeatCount="indefinite"/>
      </path>

      <g transform="translate(34 236)">
        <rect width="1008" height="96" rx="10" fill="#0d1117" stroke="#21262d"/>
        <circle cx="25" cy="48" r="9" fill="#8250df">
          <animate attributeName="opacity" values=".35;1;.35" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
        </circle>
        <text x="20" y="53" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="white">2</text>
        <text x="55" y="33" font-size="15" fill="#c9d1d9">$ awe doctor awe-demo</text>
        <text x="55" y="59" font-size="13" fill="#8b949e">[PASS] comparison replay  ·  [PASS] gate replay  ·  [PASS] typed contracts</text>
        <text x="55" y="79" font-size="13" fill="#8b949e">Independent exact-input replay checks the complete evidence chain before review.</text>
        <rect x="802" y="30" width="172" height="36" rx="18" fill="#1f2937" stroke="#444c56"/>
        <text x="827" y="53" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#c9d1d9">4 / 4 checks</text>
      </g>

      <path d="M538 342v38" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)">
        <animate attributeName="stroke" values="#8b949e;#58a6ff;#8b949e" dur="3.6s" begin="2s" repeatCount="indefinite"/>
      </path>

      <g transform="translate(34 398)">
        <rect width="1008" height="76" rx="10" fill="#0d1117" stroke="#21262d"/>
        <circle cx="25" cy="38" r="9" fill="#238636">
          <animate attributeName="opacity" values=".35;1;.35" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
        </circle>
        <text x="20" y="43" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="white">3</text>
        <text x="55" y="33" font-size="15" fill="#c9d1d9">$ awe status awe-demo --json</text>
        <text x="55" y="57" font-size="13" fill="#8b949e">state: READY  ·  decision: PASS  ·  receipt: sha256:3fb1b2ed...96344d</text>
        <rect x="812" y="20" width="162" height="34" rx="17" fill="#143d2a" stroke="#238636">
          <animate attributeName="stroke" values="#238636;#7ee787;#238636" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
        </rect>
        <text x="843" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#3fb950">READY</text>
      </g>
    </g>

    <text x="56" y="586" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b949e">For a real change: run your own harness, freeze the captured artifacts, then use the same replay and decision path.</text>
  </g>
</svg>
