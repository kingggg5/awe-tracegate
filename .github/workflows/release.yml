name: Release

on:
  push:
    # SemVer releases are immutable. The existing Action compatibility tag `3`
    # is intentionally outside this trigger and is never moved by this workflow.
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-tagged-source:
    name: Verify exact tagged source
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: Build, verify, attest, and release
    needs: verify-tagged-source
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Verify release version and tag
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_release_bundles.py version \
            --root . --tag "${GITHUB_REF_NAME}"
      - name: Build reproducible release artifacts
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH="${source_date_epoch}"
          python -m pip install --disable-pip-version-check "build==1.5.0"

          mkdir -p dist "${RUNNER_TEMP}/python-rebuild" "${RUNNER_TEMP}/npm-rebuild"
          python -m build --outdir dist
          python -m build --outdir "${RUNNER_TEMP}/python-rebuild"
          for artifact in dist/*.whl dist/*.tar.gz; do
            cmp "${artifact}" "${RUNNER_TEMP}/python-rebuild/$(basename "${artifact}")"
          done

          npm pack --pack-destination dist
          npm pack --pack-destination "${RUNNER_TEMP}/npm-rebuild"
          mapfile -t npm_archives < <(find dist -maxdepth 1 -type f -name '*.tgz')
          test "${#npm_archives[@]}" -eq 1
          cmp \
            "${npm_archives[0]}" \
            "${RUNNER_TEMP}/npm-rebuild/$(basename "${npm_archives[0]}")"

          python scripts/build_release_bundles.py plugin \
            --root . --out dist/awe-tracegate-plugin.zip
          python scripts/build_release_bundles.py plugin \
            --root . --out "${RUNNER_TEMP}/awe-tracegate-plugin.zip"
          cmp \
            dist/awe-tracegate-plugin.zip \
            "${RUNNER_TEMP}/awe-tracegate-plugin.zip"

          python -m venv "${RUNNER_TEMP}/python-smoke"
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name '*.whl')
          test "${#wheels[@]}" -eq 1
          "${RUNNER_TEMP}/python-smoke/bin/python" -m pip install \
            --disable-pip-version-check "${wheels[0]}"
          test \
            "$("${RUNNER_TEMP}/python-smoke/bin/awe" --version)" = \
            "awe ${GITHUB_REF_NAME#v}"

          schema_root="${RUNNER_TEMP}/release-schemas"
          "${RUNNER_TEMP}/python-smoke/bin/awe" schema --out-dir "${schema_root}"
          python scripts/build_release_bundles.py schemas \
            --source "${schema_root}" --out dist/awe-tracegate-schemas.zip
          python scripts/build_release_bundles.py schemas \
            --source "${schema_root}" \
            --out "${RUNNER_TEMP}/awe-tracegate-schemas.zip"
          cmp \
            dist/awe-tracegate-schemas.zip \
            "${RUNNER_TEMP}/awe-tracegate-schemas.zip"

          python scripts/build_release_bundles.py metadata \
            --root . \
            --dist dist \
            --sbom dist/awe-tracegate-release.spdx.json \
            --checksums dist/SHA256SUMS \
            --source-date-epoch "${source_date_epoch}"
          (cd dist && sha256sum --check SHA256SUMS)
          if cut -d' ' -f2- dist/SHA256SUMS | grep --quiet '/'; then
            echo "SHA256SUMS must contain artifact basenames only" >&2
            exit 1
          fi
      - name: Smoke-test packaged Python gate
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/python-smoke/bin/awe" gate \
            --traces examples/repo_analysis/traces.jsonl \
            --baseline examples/evaluation/baseline.json \
            --candidate examples/evaluation/candidate.json \
            --policy examples/evaluation/policy.json \
            --out "${RUNNER_TEMP}/release-gate.json"
          test -s "${RUNNER_TEMP}/release-gate.json"
      - name: Smoke-test packaged npm installer and plugin archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t npm_archives < <(find dist -maxdepth 1 -type f -name '*.tgz')
          test "${#npm_archives[@]}" -eq 1
          install_root="${RUNNER_TEMP}/npm-install"
          target_root="${RUNNER_TEMP}/npm-target"
          mkdir -p "${install_root}" "${target_root}"
          npm install --ignore-scripts --no-audit --no-fund \
            --prefix "${install_root}" "${npm_archives[0]}"
          cli="${install_root}/node_modules/.bin/awe-tracegate"
          expected_version="$(node --input-type=module -e \
            "import packageJson from './package.json' with { type: 'json' }; console.log(packageJson.version)")"
          test "$("${cli}" --version)" = "awe-tracegate ${expected_version}"
          "${cli}" list
          "${cli}" install --target "${target_root}"
          "${cli}" check --target "${target_root}"
          unzip -t dist/awe-tracegate-plugin.zip
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
