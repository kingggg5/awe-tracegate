<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">AWE evidence loop</title>
  <desc id="desc">An external harness captures trials. TraceGate compares, verifies, and explains the supplied evidence before a separate human decision.</desc>
  <rect width="1200" height="320" rx="24" fill="#f6f8fa"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="60" y="58" font-size="22" font-weight="700" fill="#1f2328">From an agent change to a reviewable decision</text>
    <text x="60" y="86" font-size="14" fill="#59636e">The harness runs the experiment. TraceGate re-checks the evidence. A human remains accountable.</text>
    <g transform="translate(60 126)">
      <rect width="170" height="104" rx="14" fill="#ffffff" stroke="#d0d7de"/>
      <circle cx="28" cy="30" r="10" fill="#ddf4ff" stroke="#0969da"/>
      <text x="48" y="35" font-size="16" font-weight="650" fill="#1f2328">Change</text>
      <text x="20" y="65" font-size="13" fill="#59636e">Prompt · Skill · model</text>
      <text x="20" y="85" font-size="13" fill="#59636e">or strategy</text>
    </g>
    <path d="M238 178h42" stroke="#8c959f" stroke-width="2"/>
    <path d="m276 172 8 6-8 6" fill="none" stroke="#8c959f" stroke-width="2"/>
    <g transform="translate(292 126)">
      <rect width="190" height="104" rx="14" fill="#ffffff" stroke="#d0d7de"/>
      <circle cx="28" cy="30" r="10" fill="#fff8c5" stroke="#9a6700"/>
      <text x="48" y="35" font-size="16" font-weight="650" fill="#1f2328">Capture</text>
      <text x="20" y="65" font-size="13" fill="#59636e">Frozen cases · seeds</text>
      <text x="20" y="85" font-size="13" fill="#59636e">traces · outcomes</text>
    </g>
    <path d="M490 178h42" stroke="#8c959f" stroke-width="2"/>
    <path d="m528 172 8 6-8 6" fill="none" stroke="#8c959f" stroke-width="2"/>
    <g transform="translate(544 112)">
      <rect width="286" height="132" rx="16" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
      <text x="22" y="34" font-size="12" font-weight="700" letter-spacing="1.2" fill="#0969da">TRACEGATE</text>
      <text x="22" y="62" font-size="17" font-weight="650" fill="#1f2328">Compare · verify · explain</text>
      <rect x="22" y="80" width="66" height="28" rx="14" fill="#dafbe1"/>
      <text x="42" y="99" font-size="12" font-weight="700" fill="#116329">PASS</text>
      <rect x="98" y="80" width="76" height="28" rx="14" fill="#fff8c5"/>
      <text x="113" y="99" font-size="12" font-weight="700" fill="#7d4e00">REVIEW</text>
      <rect x="184" y="80" width="72" height="28" rx="14" fill="#ffebe9"/>
      <text x="201" y="99" font-size="12" font-weight="700" fill="#a40e26">BLOCK</text>
    </g>
    <path d="M838 178h42" stroke="#8c959f" stroke-width="2"/>
    <path d="m876 172 8 6-8 6" fill="none" stroke="#8c959f" stroke-width="2"/>
    <g transform="translate(892 126)">
      <rect width="248" height="104" rx="14" fill="#ffffff" stroke="#d0d7de"/>
      <circle cx="28" cy="30" r="10" fill="#fbefff" stroke="#8250df"/>
      <text x="48" y="35" font-size="16" font-weight="650" fill="#1f2328">Human review</text>
      <text x="20" y="65" font-size="13" fill="#59636e">Receipt + evidence graph</text>
      <text x="20" y="85" font-size="13" fill="#59636e">separate accountable decision</text>
    </g>
    <text x="60" y="282" font-size="13" fill="#59636e">Offline · keyless verifier · content-addressed receipts · no model execution · no autonomous promotion</text>
  </g>
</svg>
