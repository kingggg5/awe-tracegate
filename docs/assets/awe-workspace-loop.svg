<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">AWE Workspace handoff flow</title>
  <desc id="desc">A clean animated overview of AWE Workspace: save a goal, shape a brief, approve scope, and export a typed handoff. Workspace does not execute tools or make TraceGate decisions.</desc>
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1d1d1f" flood-opacity=".10"/>
    </filter>
    <linearGradient id="hairline" x1="0" x2="1">
      <stop stop-color="#b8c9ff"/>
      <stop offset=".5" stop-color="#c7b4ff"/>
      <stop offset="1" stop-color="#9fe2c0"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="760" fill="#f5f5f7"/>
  <g font-family="Atkinson Hyperlegible Next, Segoe UI, Noto Sans, Arial, sans-serif" fill="#1d1d1f">
    <text x="72" y="72" font-size="18" font-weight="700" letter-spacing=".1em" fill="#6e6e73">AWE WORKSPACE</text>
    <text x="72" y="132" font-size="52" font-weight="760" letter-spacing="-.04em">Work, with control.</text>
    <text x="72" y="172" font-size="22" fill="#6e6e73">A simple path from goal to approved handoff.</text>
    <g transform="translate(1182 56)">
      <rect width="186" height="42" rx="21" fill="#ffffff" stroke="#d2d2d7"/>
      <circle cx="25" cy="21" r="6" fill="#34c759"/>
      <text x="42" y="27" font-size="15" font-weight="700" fill="#1d1d1f">LOCAL ONLY</text>
    </g>

    <g transform="translate(72 222)" filter="url(#softShadow)">
      <rect width="1296" height="386" rx="28" fill="#ffffff" stroke="#e1e1e6"/>
      <text x="48" y="52" font-size="20" font-weight="700">Workspace</text>
      <text x="1048" y="52" font-size="16" fill="#6e6e73">No runner active</text>
      <path d="M48 88h1200" stroke="#e5e5ea"/>

      <!-- one calm route, four equal stations -->
      <path d="M184 184H1112" stroke="#d2d2d7" stroke-width="4" stroke-linecap="round"/>
      <path d="M184 184H1112" stroke="url(#hairline)" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 14">
        <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="4s" repeatCount="indefinite"/>
      </path>

      <g transform="translate(64 112)">
        <circle cx="120" cy="72" r="18" fill="#0a84ff"><animate attributeName="r" values="18;23;18" dur="4s" repeatCount="indefinite"/></circle>
        <text x="112" y="79" font-size="18" font-weight="750" fill="#fff">1</text>
        <text x="48" y="132" font-size="21" font-weight="700">Goal</text>
        <text x="42" y="160" font-size="17" fill="#6e6e73">Save</text>
      </g>
      <g transform="translate(368 112)">
        <circle cx="120" cy="72" r="18" fill="#af52de"><animate attributeName="r" values="18;23;18" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
        <text x="112" y="79" font-size="18" font-weight="750" fill="#fff">2</text>
        <text x="39" y="132" font-size="21" font-weight="700">Discovery</text>
        <text x="52" y="160" font-size="17" fill="#6e6e73">Shape</text>
      </g>
      <g transform="translate(672 112)">
        <circle cx="120" cy="72" r="18" fill="#ff9f0a"><animate attributeName="r" values="18;23;18" dur="4s" begin="2s" repeatCount="indefinite"/></circle>
        <text x="112" y="79" font-size="18" font-weight="750" fill="#fff">3</text>
        <text x="38" y="132" font-size="21" font-weight="700">Permission</text>
        <text x="48" y="160" font-size="17" fill="#6e6e73">Approve</text>
      </g>
      <g transform="translate(976 112)">
        <circle cx="120" cy="72" r="18" fill="#34c759"><animate attributeName="r" values="18;23;18" dur="4s" begin="3s" repeatCount="indefinite"/></circle>
        <text x="112" y="79" font-size="18" font-weight="750" fill="#fff">4</text>
        <text x="28" y="132" font-size="21" font-weight="700">Handoff</text>
        <text x="52" y="160" font-size="17" fill="#6e6e73">Export</text>
      </g>

      <rect x="48" y="300" width="1200" height="48" rx="16" fill="#f5f5f7"/>
      <text x="72" y="330" font-size="16" fill="#6e6e73">Workspace coordinates. External host runs. TraceGate verifies.</text>
    </g>
    <text x="72" y="680" font-size="18" fill="#6e6e73">No shell. No browser. No credentials.</text>
  </g>
</svg>
