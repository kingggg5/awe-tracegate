<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">AWE TraceGate discovery loop walkthrough</title>
  <desc id="desc">A recorded offline synthetic walkthrough: generate a review bundle, independently replay it, then inspect its READY PASS status. The large, high-contrast layout is readable on GitHub and mobile screens.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1f2328" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0 0 10 4 0 8z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="1440" height="820" fill="#f6f8fa"/>
  <g font-family="Atkinson Hyperlegible Next, Segoe UI, Noto Sans, Arial, sans-serif" fill="#1f2328">
    <text x="72" y="70" font-size="34" font-weight="750">Discovery Loop: prove the next reusable change</text>
    <text x="72" y="108" font-size="20" fill="#424a53">A recorded synthetic walkthrough. The verifier runs offline; an external harness owns agent execution.</text>

    <g transform="translate(72 150)" filter="url(#shadow)">
      <rect width="1296" height="600" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
      <path d="M0 70h1296" stroke="#d8dee4" stroke-width="2"/>
      <circle cx="34" cy="35" r="8" fill="#cf222e"/>
      <circle cx="62" cy="35" r="8" fill="#bf8700"/>
      <circle cx="90" cy="35" r="8" fill="#1a7f37"/>
      <text x="126" y="43" font-size="19" font-weight="650" fill="#424a53">AWE — offline evidence decision</text>

      <g transform="translate(42 104)">
        <rect width="1212" height="112" rx="12" fill="#f6f8fa" stroke="#afb8c1" stroke-width="2"/>
        <circle cx="32" cy="56" r="14" fill="#0969da">
          <animate attributeName="opacity" values="1;.45;1" dur="3.6s" begin="0s" repeatCount="indefinite"/>
        </circle>
        <text x="27" y="63" font-size="18" font-weight="750" fill="#ffffff">1</text>
        <text x="72" y="46" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="650" fill="#1f2328">$ awe demo --out awe-demo</text>
        <text x="72" y="80" font-size="18" fill="#424a53">Generate a complete synthetic Gate v2 review bundle. No model or network calls.</text>
        <rect x="1070" y="34" width="112" height="44" rx="22" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
        <text x="1097" y="63" font-size="18" font-weight="750" fill="#1a7f37">PASS</text>
      </g>

      <path d="M648 224v32" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)">
        <animate attributeName="stroke" values="#57606a;#0969da;#57606a" dur="3.6s" begin=".8s" repeatCount="indefinite"/>
      </path>

      <g transform="translate(42 270)">
        <rect width="1212" height="136" rx="12" fill="#f6f8fa" stroke="#afb8c1" stroke-width="2"/>
        <circle cx="32" cy="68" r="14" fill="#8250df">
          <animate attributeName="opacity" values=".45;1;.45" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
        </circle>
        <text x="27" y="75" font-size="18" font-weight="750" fill="#ffffff">2</text>
        <text x="72" y="46" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="650" fill="#1f2328">$ awe doctor awe-demo</text>
        <text x="72" y="82" font-size="18" fill="#424a53">[PASS] comparison replay  ·  [PASS] gate replay  ·  [PASS] typed contracts</text>
        <text x="72" y="113" font-size="18" fill="#424a53">Independent exact-input replay checks the complete evidence chain before review.</text>
        <rect x="1000" y="46" width="182" height="44" rx="22" fill="#eaeef2" stroke="#8c959f" stroke-width="2"/>
        <text x="1025" y="75" font-size="18" font-weight="700" fill="#424a53">4 / 4 checks</text>
      </g>

      <path d="M648 414v32" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)">
        <animate attributeName="stroke" values="#57606a;#0969da;#57606a" dur="3.6s" begin="2s" repeatCount="indefinite"/>
      </path>

      <g transform="translate(42 460)">
        <rect width="1212" height="112" rx="12" fill="#f6f8fa" stroke="#afb8c1" stroke-width="2"/>
        <circle cx="32" cy="56" r="14" fill="#1a7f37">
          <animate attributeName="opacity" values=".45;1;.45" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
        </circle>
        <text x="27" y="63" font-size="18" font-weight="750" fill="#ffffff">3</text>
        <text x="72" y="46" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="650" fill="#1f2328">$ awe status awe-demo --json</text>
        <text x="72" y="82" font-size="18" fill="#424a53">state: READY  ·  decision: PASS  ·  receipt: sha256:3fb1b2ed…96344d</text>
        <rect x="1050" y="34" width="132" height="44" rx="22" fill="#dafbe1" stroke="#1a7f37" stroke-width="2">
          <animate attributeName="stroke" values="#1a7f37;#56d364;#1a7f37" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
        </rect>
        <text x="1080" y="63" font-size="18" font-weight="750" fill="#1a7f37">READY</text>
      </g>
    </g>

    <text x="72" y="780" font-size="18" fill="#424a53">For a real change: run your own harness, freeze the captured artifacts, then use the same replay and decision path.</text>
  </g>
</svg>
