<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">AWE evidence loop</title>
  <desc id="desc">An external harness captures trials. TraceGate checks the supplied evidence, then a human reviews the receipt. The animated route is optional and the labels remain readable when motion is disabled.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#24314f" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7b86a0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="430" rx="28" fill="#f7f8fc"/>
  <g font-family="Atkinson Hyperlegible Next, Segoe UI, Noto Sans Thai, Leelawadee UI, Arial, sans-serif" fill="#17203a">
    <text x="56" y="56" font-size="30" font-weight="760" letter-spacing="-.02em">From a change to a reviewable decision</text>
    <text x="56" y="89" font-size="16" fill="#52607a">The harness runs trials. TraceGate checks the evidence. A human remains accountable.</text>

    <g transform="translate(48 132)" filter="url(#shadow)">
      <rect width="1104" height="220" rx="20" fill="#ffffff" stroke="#dfe3ef"/>
      <g transform="translate(28 24)">
        <rect width="238" height="172" rx="14" fill="#fbfbfe" stroke="#dfe3ef"/>
        <circle cx="28" cy="32" r="12" fill="#eaf4ff" stroke="#3d83d1" stroke-width="2"/>
        <text x="52" y="39" font-size="20" font-weight="720">Change</text>
        <text x="20" y="82" font-size="16" fill="#52607a">Prompt, Skill, model</text>
        <text x="20" y="108" font-size="16" fill="#52607a">or strategy</text>
        <text x="20" y="150" font-size="14" font-weight="700" fill="#687391">01  DEFINE</text>
      </g>
      <path d="M284 110h42" fill="none" stroke="#a7afc3" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M284 110h42" fill="none" stroke="#7564e8" stroke-width="2" stroke-dasharray="5 9"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.4s" repeatCount="indefinite"/></path>

      <g transform="translate(340 24)">
        <rect width="238" height="172" rx="14" fill="#fbfbfe" stroke="#dfe3ef"/>
        <circle cx="28" cy="32" r="12" fill="#fff5d6" stroke="#b17a00" stroke-width="2"/>
        <text x="52" y="39" font-size="20" font-weight="720">Capture</text>
        <text x="20" y="82" font-size="16" fill="#52607a">Frozen cases and seeds</text>
        <text x="20" y="108" font-size="16" fill="#52607a">traces and outcomes</text>
        <text x="20" y="150" font-size="14" font-weight="700" fill="#687391">02  HOLD</text>
      </g>
      <path d="M596 110h42" fill="none" stroke="#a7afc3" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M596 110h42" fill="none" stroke="#7564e8" stroke-width="2" stroke-dasharray="5 9"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.4s" begin=".7s" repeatCount="indefinite"/></path>

      <g transform="translate(652 24)">
        <rect width="238" height="172" rx="14" fill="#fbfbfe" stroke="#7564e8" stroke-width="2"/>
        <circle cx="28" cy="32" r="12" fill="#eeeaff" stroke="#7564e8" stroke-width="2"><animate attributeName="r" values="12;15;12" dur="3.6s" repeatCount="indefinite"/></circle>
        <text x="52" y="39" font-size="20" font-weight="720">TraceGate</text>
        <text x="20" y="82" font-size="16" fill="#52607a">Compare, verify, explain</text>
        <rect x="20" y="108" width="65" height="28" rx="14" fill="#e7f7ef"/><text x="39" y="128" font-size="13" font-weight="760" fill="#1c7548">PASS</text>
        <rect x="94" y="108" width="75" height="28" rx="14" fill="#fff5d6"/><text x="108" y="128" font-size="13" font-weight="760" fill="#815b00">REVIEW</text>
        <rect x="178" y="108" width="60" height="28" rx="14" fill="#ffebe9"/><text x="193" y="128" font-size="13" font-weight="760" fill="#a40e26">BLOCK</text>
      </g>
      <path d="M908 110h42" fill="none" stroke="#a7afc3" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M908 110h42" fill="none" stroke="#7564e8" stroke-width="2" stroke-dasharray="5 9"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.4s" begin="1.4s" repeatCount="indefinite"/></path>

      <g transform="translate(964 24)">
        <rect width="112" height="172" rx="14" fill="#fbfbfe" stroke="#dfe3ef"/>
        <circle cx="28" cy="32" r="12" fill="#f1eaff" stroke="#8250df" stroke-width="2"/>
        <text x="52" y="39" font-size="20" font-weight="720">Review</text>
        <text x="20" y="82" font-size="15" fill="#52607a">Receipt</text>
        <text x="20" y="106" font-size="15" fill="#52607a">Evidence graph</text>
        <text x="20" y="150" font-size="14" font-weight="700" fill="#687391">03  DECIDE</text>
      </g>
    </g>
    <text x="56" y="393" font-size="15" fill="#687391">Offline  ·  keyless  ·  content-addressed receipts  ·  no model execution  ·  no autonomous promotion</text>
  </g>
</svg>
