name: AWE TraceGate
description: Atomically gate repeated agent traces, frozen evaluation, and optional held-input experiment comparison.
author: kingggg5

branding:
  icon: shield
  color: blue

inputs:
  traces:
    description: Path to an awe.trace.v1 JSONL file.
    required: true
  baseline-evaluation:
    description: Path to the frozen baseline evaluation bundle.
    required: true
  candidate-evaluation:
    description: Path to the candidate evaluation bundle.
    required: true
  evaluation-policy:
    description: Optional evaluation policy JSON.
    required: false
    default: ""
  receipt-path:
    description: Path where the atomic Gate v1 or Gate v2 receipt will be written.
    required: false
    default: awe-gate-receipt.json
  evidence-package:
    description: Optional provenance package binding all exact gate inputs.
    required: false
    default: ""
  repository:
    description: Expected repository URI when evidence-package is supplied.
    required: false
    default: ""
  commit-sha:
    description: Expected commit SHA when evidence-package is supplied.
    required: false
    default: ""
  evaluated-at:
    description: Explicit RFC 3339 UTC time for evidence age checks.
    required: false
    default: ""
  max-age-seconds:
    description: Optional maximum evidence age in seconds.
    required: false
    default: ""
  minimum-provenance:
    description: Optional declared provenance floor; v0.3 safely enforces asserted only.
    required: false
    default: ""
  skill-bom:
    description: Optional exact awe.skill-bom.v1 artifact for a skill-specific gate.
    required: false
    default: ""
  comparison-receipt:
    description: Optional awe.comparison-receipt.v1 to replay from held experiments with Gate v2.
    required: false
    default: ""
  baseline-experiment:
    description: Baseline awe.experiment-manifest.v1 for optional Gate v2 comparison.
    required: false
    default: ""
  candidate-experiment:
    description: Candidate awe.experiment-manifest.v1 for optional Gate v2 comparison.
    required: false
    default: ""
  comparison-policy:
    description: Optional awe.comparison-policy.v1 for optional Gate v2 comparison.
    required: false
    default: ""
  baseline-quality:
    description: Optional baseline awe.experiment-quality-evidence.v1 for Gate v2.
    required: false
    default: ""
  candidate-quality:
    description: Optional candidate awe.experiment-quality-evidence.v1 for Gate v2.
    required: false
    default: ""
  quality-policy:
    description: Optional awe.quality-policy.v1 for Gate v2 terminal and judge checks.
    required: false
    default: ""

outputs:
  decision:
    description: Atomic PASS, REVIEW, BLOCK, or ERROR gate decision.
    value: ${{ steps.gate.outputs.decision }}
  receipt-hash:
    description: Canonical atomic gate receipt digest.
    value: ${{ steps.gate.outputs.receipt-hash }}
  receipt-path:
    description: Path to the generated atomic gate receipt.
    value: ${{ steps.gate.outputs.receipt-path }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.12"

    - name: Install AWE TraceGate
      shell: bash
      run: >-
        python -m pip install --disable-pip-version-check
        "${GITHUB_ACTION_PATH}"

    - name: Gate exact evidence
      id: gate
      shell: bash
      env:
        AWE_BASELINE: ${{ inputs.baseline-evaluation }}
        AWE_CANDIDATE: ${{ inputs.candidate-evaluation }}
        AWE_CANDIDATE_EXPERIMENT: ${{ inputs.candidate-experiment }}
        AWE_CANDIDATE_QUALITY: ${{ inputs.candidate-quality }}
        AWE_COMMIT_SHA: ${{ inputs.commit-sha }}
        AWE_COMPARISON: ${{ inputs.comparison-receipt }}
        AWE_COMPARISON_POLICY: ${{ inputs.comparison-policy }}
        AWE_EVALUATED_AT: ${{ inputs.evaluated-at }}
        AWE_EVIDENCE_PACKAGE: ${{ inputs.evidence-package }}
        AWE_MAX_AGE_SECONDS: ${{ inputs.max-age-seconds }}
        AWE_MINIMUM_PROVENANCE: ${{ inputs.minimum-provenance }}
        AWE_POLICY: ${{ inputs.evaluation-policy }}
        AWE_BASELINE_EXPERIMENT: ${{ inputs.baseline-experiment }}
        AWE_BASELINE_QUALITY: ${{ inputs.baseline-quality }}
        AWE_QUALITY_POLICY: ${{ inputs.quality-policy }}
        AWE_RECEIPT_PATH: ${{ inputs.receipt-path }}
        AWE_REPOSITORY_URI: ${{ inputs.repository }}
        AWE_SKILL_BOM: ${{ inputs.skill-bom }}
        AWE_TRACES: ${{ inputs.traces }}
      run: |
        set -uo pipefail

        # Establish fail-closed outputs before parsing any repository input.
        {
          echo "decision=ERROR"
          echo "receipt-hash="
        } >> "${GITHUB_OUTPUT}"

        if [[ -z "${AWE_TRACES}" || -z "${AWE_BASELINE}" || -z "${AWE_CANDIDATE}" ]]; then
          echo "traces, baseline-evaluation, and candidate-evaluation are required" >&2
          exit 1
        fi

        comparison_requested=false
        for value in \
          "${AWE_COMPARISON}" \
          "${AWE_BASELINE_EXPERIMENT}" \
          "${AWE_CANDIDATE_EXPERIMENT}" \
          "${AWE_COMPARISON_POLICY}" \
          "${AWE_BASELINE_QUALITY}" \
          "${AWE_CANDIDATE_QUALITY}" \
          "${AWE_QUALITY_POLICY}"; do
          if [[ -n "${value}" ]]; then
            comparison_requested=true
          fi
        done

        if [[ "${comparison_requested}" == true ]]; then
          if [[ -z "${AWE_COMPARISON}" || -z "${AWE_BASELINE_EXPERIMENT}" || -z "${AWE_CANDIDATE_EXPERIMENT}" ]]; then
            echo "comparison-receipt, baseline-experiment, and candidate-experiment are required for Gate v2" >&2
            exit 1
          fi
          args=(
            gate-v2
            --traces "${AWE_TRACES}"
            --baseline "${AWE_BASELINE}"
            --candidate "${AWE_CANDIDATE}"
            --comparison "${AWE_COMPARISON}"
            --baseline-experiment "${AWE_BASELINE_EXPERIMENT}"
            --candidate-experiment "${AWE_CANDIDATE_EXPERIMENT}"
            --out "${AWE_RECEIPT_PATH}"
          )
          if [[ -n "${AWE_POLICY}" ]]; then
            args+=(--evaluation-policy "${AWE_POLICY}")
          fi
          if [[ -n "${AWE_COMPARISON_POLICY}" ]]; then
            args+=(--comparison-policy "${AWE_COMPARISON_POLICY}")
          fi
          if [[ -n "${AWE_BASELINE_QUALITY}" ]]; then
            args+=(--baseline-quality "${AWE_BASELINE_QUALITY}")
          fi
          if [[ -n "${AWE_CANDIDATE_QUALITY}" ]]; then
            args+=(--candidate-quality "${AWE_CANDIDATE_QUALITY}")
          fi
          if [[ -n "${AWE_QUALITY_POLICY}" ]]; then
            args+=(--quality-policy "${AWE_QUALITY_POLICY}")
          fi
        else
          args=(
            gate
            --traces "${AWE_TRACES}"
            --baseline "${AWE_BASELINE}"
            --candidate "${AWE_CANDIDATE}"
            --out "${AWE_RECEIPT_PATH}"
          )
          if [[ -n "${AWE_POLICY}" ]]; then
            args+=(--policy "${AWE_POLICY}")
          fi
        fi
        if [[ -n "${AWE_SKILL_BOM}" ]]; then
          args+=(--skill-bom "${AWE_SKILL_BOM}")
        fi

        provenance_requested=false
        for value in \
          "${AWE_REPOSITORY_URI}" \
          "${AWE_COMMIT_SHA}" \
          "${AWE_EVALUATED_AT}" \
          "${AWE_MAX_AGE_SECONDS}" \
          "${AWE_MINIMUM_PROVENANCE}"; do
          if [[ -n "${value}" ]]; then
            provenance_requested=true
          fi
        done

        if [[ -n "${AWE_EVIDENCE_PACKAGE}" ]]; then
          repository_uri="${AWE_REPOSITORY_URI:-${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}}"
          commit_sha="${AWE_COMMIT_SHA:-${GITHUB_SHA}}"
          args+=(
            --evidence-package "${AWE_EVIDENCE_PACKAGE}"
            --repository "${repository_uri}"
            --commit-sha "${commit_sha}"
          )
          if [[ -n "${AWE_EVALUATED_AT}" ]]; then
            args+=(--evaluated-at "${AWE_EVALUATED_AT}")
          fi
          if [[ -n "${AWE_MAX_AGE_SECONDS}" ]]; then
            if [[ -z "${AWE_EVALUATED_AT}" ]]; then
              echo "evaluated-at is required when max-age-seconds is set" >&2
              exit 1
            fi
            args+=(--max-age-seconds "${AWE_MAX_AGE_SECONDS}")
          fi
          if [[ -n "${AWE_MINIMUM_PROVENANCE}" ]]; then
            args+=(--minimum-provenance "${AWE_MINIMUM_PROVENANCE}")
          fi
        elif [[ "${provenance_requested}" == true ]]; then
          echo "repository, commit-sha, age, and provenance checks require evidence-package" >&2
          exit 1
        fi

        set +e
        awe "${args[@]}"
        gate_exit=$?
        if [[ -f "${AWE_RECEIPT_PATH}" ]]; then
          python "${GITHUB_ACTION_PATH}/scripts/github_action_summary.py" \
            --receipt "${AWE_RECEIPT_PATH}"
          summary_exit=$?
        else
          echo "AWE did not produce an atomic gate receipt" >&2
          summary_exit=1
        fi
        set -e

        if [[ "${gate_exit}" -ne "${summary_exit}" ]]; then
          echo "gate CLI exit ${gate_exit} disagrees with its typed receipt (${summary_exit})" >&2
          echo "decision=ERROR" >> "${GITHUB_OUTPUT}"
          exit 1
        fi
        exit "${gate_exit}"
