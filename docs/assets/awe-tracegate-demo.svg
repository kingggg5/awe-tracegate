<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">AWE TraceGate evidence receipt demo</title>
  <desc id="desc">Two read-only traces pass through an evidence gate, producing a compiled candidate, passing evaluation, and a verified canonical receipt.</desc>
  <rect width="1440" height="820" rx="28" fill="#f6f8fa"/>
  <rect x="28" y="28" width="1384" height="764" rx="20" fill="#ffffff" stroke="#d0d7de"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#1f2328">
    <text x="72" y="88" font-size="28" font-weight="650">AWE TraceGate</text>
    <text x="72" y="120" font-size="16" fill="#59636e">Evidence-gated workflow review · offline · zero verifier LLM keys</text>
    <rect x="72" y="154" width="1296" height="54" rx="8" fill="#0d1117"/>
    <text x="96" y="188" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" fill="#f0f6fc">$ awe compile --traces examples/repo_analysis/traces.jsonl --out receipt.json</text>

    <text x="72" y="264" font-size="14" font-weight="650" fill="#59636e">OBSERVED EVIDENCE</text>
    <rect x="72" y="286" width="320" height="154" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="104" cy="320" r="11" fill="#1f883d"/>
    <text x="128" y="326" font-size="18" font-weight="650">repo_analysis_001</text>
    <text x="104" y="364" font-size="15" fill="#59636e">3 typed steps · succeeded</text>
    <text x="104" y="396" font-size="15" fill="#59636e">pure/read effects only</text>

    <rect x="72" y="458" width="320" height="154" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="104" cy="492" r="11" fill="#1f883d"/>
    <text x="128" y="498" font-size="18" font-weight="650">repo_analysis_002</text>
    <text x="104" y="536" font-size="15" fill="#59636e">same intent and shape</text>
    <text x="104" y="568" font-size="15" fill="#59636e">matching field digests</text>

    <path d="M420 450H520" stroke="#8c959f" stroke-width="2"/>
    <path d="M508 442L520 450L508 458" fill="none" stroke="#8c959f" stroke-width="2"/>

    <text x="548" y="264" font-size="14" font-weight="650" fill="#59636e">DETERMINISTIC GATE</text>
    <rect x="520" y="286" width="340" height="326" rx="14" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="552" y="330" font-size="22" font-weight="650">Evidence checks</text>
    <text x="552" y="374" font-size="16">✓ exact tool versions</text>
    <text x="552" y="410" font-size="16">✓ explicit data bindings</text>
    <text x="552" y="446" font-size="16">✓ unique producer attribution</text>
    <text x="552" y="482" font-size="16">✓ no write or high-impact effect</text>
    <text x="552" y="518" font-size="16">✓ frozen evaluation non-regression</text>
    <rect x="552" y="548" width="276" height="38" rx="19" fill="#1f883d"/>
    <text x="690" y="573" text-anchor="middle" font-size="15" font-weight="650" fill="#ffffff">PASS · candidate reviewable</text>

    <path d="M888 450H988" stroke="#8c959f" stroke-width="2"/>
    <path d="M976 442L988 450L976 458" fill="none" stroke="#8c959f" stroke-width="2"/>

    <text x="1016" y="264" font-size="14" font-weight="650" fill="#59636e">VERIFIABLE RECEIPT</text>
    <rect x="988" y="286" width="380" height="326" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="1020" y="330" font-size="22" font-weight="650">Compiled candidate</text>
    <text x="1020" y="374" font-size="16" fill="#59636e">Proven dependencies</text>
    <text x="1328" y="374" text-anchor="end" font-size="16" font-weight="650">3</text>
    <text x="1020" y="410" font-size="16" fill="#59636e">Effect scope</text>
    <text x="1328" y="410" text-anchor="end" font-size="16" font-weight="650">pure_or_read</text>
    <text x="1020" y="446" font-size="16" fill="#59636e">Evaluation</text>
    <text x="1328" y="446" text-anchor="end" font-size="16" font-weight="650" fill="#1a7f37">PASS</text>
    <line x1="1020" y1="474" x2="1336" y2="474" stroke="#d8dee4"/>
    <text x="1020" y="510" font-size="14" fill="#59636e">receipt_hash</text>
    <text x="1020" y="540" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">sha256:f4bab189f87c…</text>
    <text x="1020" y="576" font-size="14" fill="#1a7f37">✓ replayed against exact source traces</text>

    <rect x="72" y="668" width="1296" height="76" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="100" y="700" font-size="16" font-weight="650">What PASS means</text>
    <text x="100" y="726" font-size="15" fill="#424a53">The observed read-only structure is supported by the supplied evidence. A human still owns promotion and every production action.</text>
  </g>
</svg>
