<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">AWE TraceGate discovery loop walkthrough</title>
  <desc id="desc">A recorded offline synthetic walkthrough: build a review bundle, replay its held inputs, and inspect the resulting PASS decision. The external harness owns agent execution.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#27304d" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8" fill="none" stroke="#687391" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="28" fill="#f7f8fc"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="56" y="62" font-size="28" font-weight="720" letter-spacing="-.5" fill="#17203a">Discovery loop, made visible.</text>
    <text x="56" y="92" font-size="15" fill="#52607a">A synthetic offline walkthrough: create &#x2192; replay &#x2192; inspect. The external harness still owns agent execution.</text>

    <g transform="translate(56 126)" filter="url(#shadow)">
      <rect width="1088" height="414" rx="22" fill="#ffffff" stroke="#dfe3ef"/>
      <path d="M0 62h1088" stroke="#e8ebf3"/>
      <circle cx="30" cy="31" r="5" fill="#8c78ff"/>
      <text x="50" y="36" font-size="12" font-weight="700" letter-spacing="1.5" fill="#687391">AWE TRACEGATE  /  OFFLINE DEMO</text>
      <rect x="874" y="17" width="174" height="28" rx="14" fill="#f0edff"/>
      <text x="900" y="35" font-size="12" font-weight="700" fill="#5849a5">SYNTHETIC FIXTURE</text>

      <g transform="translate(34 96)">
        <rect width="302" height="228" rx="16" fill="#fbfbfe" stroke="#dfe3ef"/>
        <circle cx="30" cy="34" r="15" fill="#ebe8ff" stroke="#7564e8"/>
        <text x="25" y="39" font-size="12" font-weight="750" fill="#4f42a0">01</text>
        <text x="58" y="30" font-size="12" font-weight="750" letter-spacing="1.1" fill="#687391">BUILD</text>
        <text x="22" y="78" font-size="17" font-weight="700" fill="#17203a">Create the bundle</text>
        <rect x="22" y="96" width="258" height="34" rx="8" fill="#f0edff"/>
        <text x="36" y="118" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#403773">awe demo --out awe-demo</text>
        <text x="22" y="158" font-size="13" fill="#52607a">Builds a complete Gate v2 fixture.</text>
        <text x="22" y="180" font-size="13" fill="#52607a">No model calls. No network calls.</text>
        <rect x="22" y="196" width="68" height="24" rx="12" fill="#e7f7ef"/>
        <text x="42" y="212" font-size="11" font-weight="750" fill="#1c7548">PASS</text>
        <circle class="motion" cx="270" cy="34" r="4" fill="#7564e8">
          <animate attributeName="r" values="4;7;4" dur="3.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;.35;1" dur="3.6s" repeatCount="indefinite"/>
        </circle>
      </g>

      <g transform="translate(393 96)">
        <rect width="302" height="228" rx="16" fill="#fbfbfe" stroke="#dfe3ef"/>
        <circle cx="30" cy="34" r="15" fill="#e5f2ff" stroke="#4e8ed8"/>
        <text x="25" y="39" font-size="12" font-weight="750" fill="#285d9e">02</text>
        <text x="58" y="30" font-size="12" font-weight="750" letter-spacing="1.1" fill="#687391">REPLAY</text>
        <text x="22" y="78" font-size="17" font-weight="700" fill="#17203a">Check every link</text>
        <rect x="22" y="96" width="258" height="34" rx="8" fill="#eaf4ff"/>
        <text x="36" y="118" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#285d9e">awe doctor awe-demo</text>
        <text x="22" y="158" font-size="13" fill="#52607a">Reloads held inputs independently.</text>
        <text x="22" y="180" font-size="13" fill="#52607a">Comparison, gate, and contracts.</text>
        <rect x="22" y="196" width="88" height="24" rx="12" fill="#eaf4ff"/>
        <text x="39" y="212" font-size="11" font-weight="750" fill="#285d9e">4 / 4 CHECKS</text>
        <circle class="motion" cx="270" cy="34" r="4" fill="#4e8ed8">
          <animate attributeName="r" values="4;7;4" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".35;1;.35" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
        </circle>
      </g>

      <g transform="translate(752 96)">
        <rect width="302" height="228" rx="16" fill="#fbfbfe" stroke="#dfe3ef"/>
        <circle cx="30" cy="34" r="15" fill="#e7f7ef" stroke="#43a878"/>
        <text x="25" y="39" font-size="12" font-weight="750" fill="#1c7548">03</text>
        <text x="58" y="30" font-size="12" font-weight="750" letter-spacing="1.1" fill="#687391">DECIDE</text>
        <text x="22" y="78" font-size="17" font-weight="700" fill="#17203a">Inspect the receipt</text>
        <rect x="22" y="96" width="258" height="34" rx="8" fill="#e7f7ef"/>
        <text x="36" y="118" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1c7548">awe status awe-demo --json</text>
        <text x="22" y="158" font-size="13" fill="#52607a">state: READY  &#xB7;  decision: PASS</text>
        <text x="22" y="180" font-size="13" fill="#52607a">receipt: sha256:3fb1b2ed...96344d</text>
        <rect x="22" y="196" width="68" height="24" rx="12" fill="#e7f7ef"/>
        <text x="42" y="212" font-size="11" font-weight="750" fill="#1c7548">READY</text>
        <circle class="motion" cx="270" cy="34" r="4" fill="#43a878">
          <animate attributeName="r" values="4;7;4" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".35;1;.35" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
        </circle>
      </g>

      <path d="M336 210h48" fill="none" stroke="#a7afc3" stroke-linecap="round" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M695 210h48" fill="none" stroke="#a7afc3" stroke-linecap="round" stroke-width="2" marker-end="url(#arrow)"/>
      <g class="motion" fill="none" stroke="#7564e8" stroke-linecap="round" stroke-width="2" stroke-dasharray="5 9">
        <path d="M336 210h48"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.4s" repeatCount="indefinite"/></path>
        <path d="M695 210h48"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.4s" begin=".7s" repeatCount="indefinite"/></path>
      </g>

      <path d="M905 340c0 18-84 34-362 34S182 358 182 340" fill="none" stroke="#c4c9d8" stroke-dasharray="4 8" stroke-linecap="round" marker-end="url(#arrow)"/>
      <path class="motion" d="M905 340c0 18-84 34-362 34S182 358 182 340" fill="none" stroke="#7564e8" stroke-dasharray="4 8" stroke-linecap="round" stroke-width="2">
        <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2.8s" repeatCount="indefinite"/>
      </path>
      <rect x="410" y="385" width="274" height="26" rx="13" fill="#ffffff" stroke="#e1e5ef"/>
      <text x="547" y="402" text-anchor="middle" font-size="12" fill="#687391">Repeat with a real, consented change</text>
    </g>

    <text x="56" y="586" font-size="13" fill="#687391">Synthetic fixture  &#xB7;  offline  &#xB7;  keyless  &#xB7;  no agent execution  &#xB7;  every step stays readable without motion</text>
  </g>
</svg>
